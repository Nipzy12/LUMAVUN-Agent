name: Windows backend regression tests

on:
  pull_request:
  push:
    branches:
      - hotfix/windows-cancellation-regression
      - feature/phase-3.2.3-advanced-studio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.15']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all backend tests
        run: python -m pytest -ra

  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install mocked browser test dependencies
        run: python -m pip install -r requirements.txt playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run disposable mocked Office integration tests
        env:
          LUMA_UI_ARTIFACT_DIR: ${{ runner.temp }}/luma-office-screenshots
        run: python tests/browser_office.py
      - name: Upload mock-only review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mocked-office-screenshots
          path: ${{ runner.temp }}/luma-office-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
