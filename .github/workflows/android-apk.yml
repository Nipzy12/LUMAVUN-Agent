name: Android Standalone APK
on:
  workflow_dispatch:
  push:
    branches: [main, build/lumavun-apk-pr4]
    paths:
      - 'App.tsx'
      - 'src/**'
      - 'app.json'
      - 'assets/lumavun-icon.svg'
      - 'scripts/generate-assets.mjs'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/android-apk.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Verify Expo dependencies
        run: npx expo install --check
      - name: Typecheck
        run: npm run typecheck
      - name: Test agent safety
        run: npm test
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Sign standalone release for personal testing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          source = p.read_text()
          start = source.find('buildTypes {')
          if start < 0:
              raise SystemExit('Cannot find Android buildTypes block')
          start_release = source.find('release {', start)
          if start_release < 0:
              raise SystemExit('Cannot find release build type')
          left, right = source[:start_release], source[start_release:]
          # Use the generated debug keystore for an installable internal-test
          # RELEASE variant. Do NOT use this key for Google Play distribution.
          right = right.replace('signingConfig signingConfigs.release', 'signingConfig signingConfigs.debug', 1)
          if 'signingConfig signingConfigs.debug' not in right.split('release {', 1)[1][:1100]:
              right = right.replace('release {', 'release {\n            signingConfig signingConfigs.debug', 1)
          p.write_text(left + right)
          PY
      - name: Bundle JS and build standalone APK
        run: cd android && chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon
      - name: Verify JS bundle is embedded and APK is signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx 'assets/index.android.bundle'
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: lumavun-android-standalone
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
